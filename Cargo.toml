[package]
name = "seam"
version = "1.2.0"
edition = "2024"
description = "Low-latency encrypted keyboard, mouse and clipboard sharing for macOS and Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarisc/seam"
readme = "README.md"

# Optimize distribution binaries across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
# Function names and lines in the symbol file (seam_agent.pdb on Windows),
# for the thread stacks a stuck agent logs.
debug = "line-tables-only"

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
blake3 = "1.8"
clipboard-rs = "0.3.5"
# Records a controlled computer's sound and plays it on the controlling one.
# `realtime` runs the audio threads at real-time priority (MMCSS on Windows).
cpal = { version = "0.18.2", features = ["realtime"] }
# The same real-time scheduling for the threads that send and play sound.
audio_thread_priority = { version = "0.35", default-features = false }
crossbeam-channel = "0.5"
data-encoding = "2.9"
dirs = "6.0"
display-info = "0.5.9"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts"], optional = true }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"] }
# Matches the two computers' sample rates and audio clocks.
rubato = { version = "5.0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
walkdir = "2.5"
if-addrs = "0.15.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_NetworkManagement_QoS", "Win32_Networking_WinSock", "Win32_System_DataExchange", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Power", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel"] }
windows-service = "0.8"
# Records whichever speakers play, or every app, and writes sound straight
# into the speakers' buffer, and offers files on the clipboard. The version
# cpal uses.
windows = { version = "0.62", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# Answers Windows when it has set up recording every app, or devices change.
windows-core = "0.62"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "seam-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "seam"
path = "src/bin/seam.rs"
required-features = ["gui"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_Security"] }
